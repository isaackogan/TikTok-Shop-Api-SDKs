[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-shop-api"
version = "0.1.0"
description = "Python client for the TikTok Shop API (TikTok Shop Partner API): request signing, OAuth, multi-shop support and typed webhooks. Unofficial. Not affiliated with or endorsed by TikTok or ByteDance."
license = "MIT"
# The generated client uses typing.Self and enum.StrEnum, both new in Python 3.11.
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.23.1,<0.29.0",
  "attrs>=22.2.0",
]
keywords = [
  "tiktok shop api", "tiktok shop", "tiktok shop partner api", "tiktok shop sdk",
  "tiktok shop webhooks", "tiktok shop oauth", "tiktok shop openapi", "ecommerce", "unofficial",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "openapi-python-client==0.29.1",
]

[project.urls]
Homepage = "https://github.com/isaackogan/TikTok-Shop-Api-SDKs/tree/main/python#readme"
Repository = "https://github.com/isaackogan/TikTok-Shop-Api-SDKs"
Issues = "https://github.com/isaackogan/TikTok-Shop-Api-SDKs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_shop_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
