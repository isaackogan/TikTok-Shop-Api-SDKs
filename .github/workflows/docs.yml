# Validates and builds the documentation site in docs/, and deploys it to Cloudflare Workers from main.
# The site bundles .openapi/, so a regenerated spec redeploys it with the new API reference.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".openapi/**"
      - "*/README.md"
      - "java/pom.xml"
      - "kotlin/build.gradle.kts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".openapi/**"
      - "*/README.md"
      - "java/pom.xml"
      - "kotlin/build.gradle.kts"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Deployment runs only where the Cloudflare secrets exist; forks and pull requests skip it.
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: docs/package.json
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Validate and build documentation
        run: pnpm --dir docs build
      - name: Upload site for review
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/dist
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          packageManager: pnpm
          command: deploy
